      if (m === 'table') body = tableReport(all.filter(function (r) { return (r.s == null && r.f == null) || overlaps(r, a, b); }), procMap, o);
      else if (m === 'calendar') body = calendarReport(all, procMap, o);
      else body = ganttReport(all, procMap, o);

      printHtml(body, o);
    };
  };
